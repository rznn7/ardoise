<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ardoise</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ardoise" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131110" />
    <script>
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('ardoise.theme') || 'system';
        } catch (e) {}
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (preference === 'dark' || (preference !== 'light' && systemDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
