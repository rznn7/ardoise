<app-mobile-shell>
  <div appShellHeader class="flex items-center gap-3 bg-background px-4 py-2">
    <button
      aria-label="Back"
      class="size-11 shrink-0 rounded-full"
      hlmBtn
      size="icon-lg"
      type="button"
      variant="ghost"
      (click)="back()"
    >
      <ng-icon hlm name="lucideChevronLeft" size="sm" aria-hidden="true" />
    </button>
    @if (draft.group(); as group) {
      <app-group-chip [groupId]="group.id" [name]="group.name" />
    }
  </div>

  <form class="flex min-h-full flex-col gap-6 px-4 pt-6 pb-4" (submit)="next($event)">
    @if (draft.group(); as group) {
      <app-money-amount
        appTitle
        [cents]="draft.amountCents() ?? 0"
        [currency]="group.currencyCode"
      />
    }
    <div class="flex flex-col gap-2">
      <input
        #titleInput
        autocomplete="off"
        class="h-11"
        enterkeyhint="next"
        hlmInput
        id="payment-title"
        [maxLength]="maxLength"
        [placeholder]="placeholder"
        [value]="draft.title()"
        (input)="draft.title.set(titleInput.value)"
      />
      <label appMeta for="payment-title">Title</label>
    </div>
    <button class="mt-auto w-full" hlmBtn size="xl" type="submit">
      {{ editing() ? 'Done' : 'Next' }}
    </button>
  </form>
</app-mobile-shell>
