<hlm-sheet #signOutSheet="hlmSheet" side="bottom" (closed)="resetSignOut()">
  <app-mobile-shell>
    <div appShellHeader class="flex items-center gap-3 bg-background px-4 py-2">
      <button
        aria-label="Back"
        class="size-11 shrink-0 rounded-full"
        hlmBtn
        size="icon-lg"
        type="button"
        variant="ghost"
        (click)="back()"
      >
        <ng-icon hlm name="lucideChevronLeft" size="sm" aria-hidden="true" />
      </button>
      <h1 appTitle>Settings</h1>
    </div>

    <div class="flex min-h-full flex-col">
      <section class="flex flex-col gap-2 px-4 pt-6" aria-labelledby="theme-heading">
        <h2 appEyebrow id="theme-heading">Theme</h2>
        <div
          aria-labelledby="theme-heading"
          class="w-full"
          hlmToggleGroup
          type="single"
          variant="outline"
          [nullable]="false"
          [value]="theme.preference()"
          (valueChange)="selectTheme($event)"
        >
          <button class="h-11 flex-1" hlmToggleGroupItem value="system">System</button>
          <button class="h-11 flex-1" hlmToggleGroupItem value="light">Light</button>
          <button class="h-11 flex-1" hlmToggleGroupItem value="dark">Dark</button>
        </div>
      </section>

      <div class="mt-8 border-y border-border">
        <button class="block w-full text-left" hlmSheetTrigger type="button">
          <app-list-row>
            <span appListRowTitle class="text-destructive">Sign out</span>
          </app-list-row>
        </button>
      </div>

      <p appMeta class="mt-auto px-4 pt-10 pb-4 text-center">{{ version.label() }}</p>
    </div>
  </app-mobile-shell>

  <hlm-sheet-content *brnSheetContent>
    <div hlmSheetHeader>
      <h3 hlmSheetTitle>Sign out?</h3>
      <p hlmSheetDescription>You'll need your passkey on this device to sign back in.</p>
    </div>
    <div class="flex flex-col gap-3 p-4 pb-8">
      @if (signOutState() === 'failed') {
        <p appError role="alert">Couldn't sign out. Try again.</p>
      }
      <button
        hlmBtn
        size="xl"
        type="button"
        variant="destructive"
        [disabled]="signOutState() === 'busy'"
        (click)="signOut()"
      >
        Sign out
      </button>
      <button hlmBtn size="xl" type="button" variant="outline" (click)="signOutSheet.close()">
        Cancel
      </button>
    </div>
  </hlm-sheet-content>
</hlm-sheet>
