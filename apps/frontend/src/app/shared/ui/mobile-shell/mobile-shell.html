<div class="relative flex h-full w-full flex-col overflow-hidden sm:max-w-md">
  @if (header()) {
    <header class="sticky top-0 z-10">
      <ng-content select="[appShellHeader]" />
    </header>
  }
  <main
    #main
    #pull="appPullToRefresh"
    class="flex flex-1 flex-col overflow-y-auto overscroll-contain"
    [appPullToRefresh]="refreshable()"
    (pulled)="refresh.emit()"
    (scroll)="scrolled()"
  >
    @if (refreshable() && (refreshing() || pull.distance() > 0)) {
      <div
        role="status"
        class="flex shrink-0 items-center justify-center overflow-hidden"
        [attr.aria-label]="refreshing() ? 'Refreshing' : 'Pull to refresh'"
        [style.height.px]="refreshing() ? 56 : pull.distance()"
      >
        <hlm-spinner />
      </div>
    }
    <ng-content />
  </main>
  @if (fab()) {
    <div
      class="absolute right-0 bottom-0 z-10 p-4"
      [class.pb-[max(1rem,env(safe-area-inset-bottom))]]="bleed()"
      [class.pb-[max(0px,calc(1rem-env(safe-area-inset-bottom)))]]="!bleed()"
    >
      <ng-content select="[appShellFab]" />
    </div>
  }
</div>
