@let currentState = state();

@switch (currentState.state) {
  @case ('idle') {
    <button hlmBtn variant="inverted" size="xl" (click)="login()">
      <ng-icon name="lucideKeyRound" />
      <span>Login with passkey</span>
    </button>
  }
  @case ('loading') {
    <button hlmBtn variant="inverted" size="xl" [disabled]="true">
      <hlm-spinner />
      <span>Login in...</span>
    </button>
  }
  @case ('error') {
    <button hlmBtn variant="inverted" size="xl" (click)="login()">
      <ng-icon name="lucideRefreshCw" data-icon="inline-end" />
      <span>{{ currentState.message }} Retry?</span>
    </button>
  }
}
